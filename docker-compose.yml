# Stack base. Levanta postgres + redis + api + motor + web.
# Para forzar modo beta, combinar con docker-compose.beta.yml:
#   docker compose -f docker-compose.yml -f docker-compose.beta.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-facturador}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar_en_produccion}
      POSTGRES_DB: ${POSTGRES_DB:-facturador}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - facturador-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - facturador-net

  motor:
    build:
      context: ./apps/motor
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MOTOR_PORT: ${MOTOR_PORT:-8000}
      SUNAT_MODE: ${SUNAT_MODE:-beta}
    volumes:
      # Certificados montados read-only. Nunca escritos por el motor.
      - ./certs:/app/certs:ro
    networks:
      - facturador-net
    expose:
      - "8000"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      motor:
        condition: service_started
    environment:
      API_PORT: ${API_PORT:-8080}
      API_JWT_SECRET: ${API_JWT_SECRET}
      API_JWT_ACCESS_TTL: ${API_JWT_ACCESS_TTL:-15m}
      API_JWT_REFRESH_TTL: ${API_JWT_REFRESH_TTL:-720h}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:5173}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-facturador}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar_en_produccion}
      POSTGRES_DB: ${POSTGRES_DB:-facturador}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MOTOR_URL: ${MOTOR_URL:-http://motor:8000}
      SUNAT_MODE: ${SUNAT_MODE:-beta}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./certs:/app/certs:ro
    networks:
      - facturador-net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api
    networks:
      - facturador-net

volumes:
  pgdata:
  redisdata:

networks:
  facturador-net:
    driver: bridge
